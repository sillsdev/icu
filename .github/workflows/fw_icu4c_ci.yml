# GitHub Action ICU continuous integration tasks.

name: FW Branch CI

on:
  push:
    branches:
      - fw
  pull_request:
    branches: 'fw'

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        platform: [Win32, x64]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v2.3.4
      with:
        fetch-depth: 0

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe (Windows OS)
      uses: microsoft/setup-msbuild@v1.1
      if: ${{ matrix.os == 'windows-latest' }}

    - name: Build ICU
      working-directory: icu4c
      run: msbuild source/allinone/allinone.sln /p:Configuration=Release /p:Platform=${{matrix.platform}} /p:SkipUWP=true
      if: ${{ matrix.os == 'windows-latest' }}

    - name: Test ICU
      run: source/allinone/icucheck.bat ${{matrix.platform}} Release
      working-directory: icu4c

    - name: Package
      working-directory: icu4c
      run: msbuild nugetpackage/build/icu4c.proj /t:BuildPackage

    - name: Upload Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: packages
        path: ./**/*.nupkg