# GitHub Action ICU continuous integration tasks.

name: FW Branch CI

on:
  push:
    branches:
      - fw
  pull_request:
    branches: 'fw'

# Cancel any workflow jobs running if the PR is re-triggered
concurrency:
  group: ci-${{ github.head_ref }}-group
  cancel-in-progress: true

jobs:
  set-version-number:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc-version.outputs.result }}
    steps:
    - name: Checkout
      uses: actions/checkout@v2.3.4
      with:
        fetch-depth: 0

    - id: calc-version
      name: Calculate Version
      run: |
        major=$(grep -oP '.*U_ICU_VERSION_MAJOR_NUM \K.*' icu4c/source/common/unicode/uvernum.h)
        minor=$(grep -oP '.*U_ICU_VERSION_MINOR_NUM \K.*' icu4c/source/common/unicode/uvernum.h)
        build=${{ github.run_number }}
        echo "::set-output name=result::$major.$minor.$build"

  win-build-test-package:
    needs: set-version-number
    strategy:
      fail-fast: false
    runs-on: windows-latest

    steps:
    - name: Verify Version
      run: |
        echo "Version ${{ needs.set-version-number.outputs.version }}"

    - name: Checkout
      uses: actions/checkout@v2.3.4
      with:
        fetch-depth: 0

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe (Windows OS)
      uses: microsoft/setup-msbuild@v1.1

    - name: Build ICU 32 bit
      working-directory: icu4c
      run: msbuild source/allinone/allinone.sln /p:Configuration=Release /p:Platform=Win32 /p:SkipUWP=true

    # Build the data into the icu{ver}dt.dll
    - name: Build ICU Data 32 bit
      working-directory: icu4c
      run: msbuild source/allinone/allinone.sln /t:makedata /p:Configuration=Release /p:Platform=Win32 /p:SkipUWP=true

    - name: Prepare data for SIL tests
      working-directory: icu4c
      run: msbuild nugetpackage/build/icu4c.proj /t:PrepareTestData

    - name: Test ICU 32 bit
      run: source/allinone/icucheck.bat x86 Release
      working-directory: icu4c

    - name: Build ICU 64 bit
      working-directory: icu4c
      run: msbuild source/allinone/allinone.sln /p:Configuration=Release /p:Platform=x64 /p:SkipUWP=true

    - name: Build ICU Data 64 bit
      working-directory: icu4c
      run: msbuild source/allinone/allinone.sln /t:makedata /p:Configuration=Release /p:Platform=x64 /p:SkipUWP=true

    - name: Test ICU 64 bit
      run: source/allinone/icucheck.bat x64 Release
      working-directory: icu4c

    - name: Package (both 32bit and 64bit architectures)
      working-directory: icu4c
      run: msbuild nugetpackage/build/icu4c.proj /t:BuildPackage /p:PkgVersion=${{ needs.set-version-number.outputs.version }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: packages
        path: ./**/*.nupkg
        if-no-files-found: error

    - name: Publish nuget packages
      if: github.event.pull_request.merged == true
      run: dotnet nuget push -k {{ secrets.ICU_NUGET_API_KEY }} ./**/*.nupkg


  # Run ICU4C tests with SIL mod and stub data
  # Adapted from run-with-stubdata from unicode-org/icu/.github/icu_ci.yml
  linux-build-test-with-silmods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4
        with:
          fetch-depth: 0

      - name: Build - Setup SIL Data (and icu stubdata) Run tests
        run: |
          cd icu4c/source;
          ./runConfigureICU Linux;
          make -j2;
          echo 'make directory for sil test data NB: update folder for new version';
          mkdir test/cintltst/icudt70l;
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:./lib/
          ./bin/gennorm2 -o ./test/cintltst/icudt70l/nfkc.nrm ./data/unidata/norm2/nfc.txt ./data/unidata/norm2/nfkc.txt ./test/cintltst/nfkcOverridesTest.txt;
          cd test/cintltst;
          echo 'Running ICU4C cintltst';
          make -j2 check;

  debian-packaging:
    needs: set-version-number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Checkout ci-build-tools
        run: |
          set -xueo pipefail
          cd /home/runner/work/icu
          git clone https://github.com/sillsdev/ci-builder-scripts

      - name: Set experimental Suffix for PR Builds
        if: github.event.pull_request.merged != true
        run: echo "package_suffix=.experimental" >> $GITHUB_ENV 

      # TODO more will need done to do this successfully since some files are root readable only
      - name: Cache
        uses: actions/cache@v2
        with:
          path: /var/lib/schroot/chroots
          key: icu-debian-package-${{ github.ref_name }}
          restore-keys: icu-debian-package-${{ github.base_ref || github.ref_name }}
      - name: Seed cache
        run: |
          set -xueo pipefail
          mkdir --verbose ~/.gnupg
          cd /home/runner/work/icu/ci-builder-scripts/bash
          ./setup.sh --dists "focal bionic" --arches amd64
      - name: Build debian package
        env:
          WORKAREA: /home/runner/work/${{github.event.repository.name}}
        run: |
          set -xueo pipefail
          unset MAILPROG
          sudo apt-get install -y devscripts dh-make dirmngr sendmail
          mkdir --verbose --parents ~/.gnupg
          export WORKSPACE="${WORKAREA}/icu/icu4c"
          export CI_SCRIPT_DIR="${WORKAREA}/ci-builder-scripts"
          export ARCHES_TO_PACKAGE="amd64"
          cd "${WORKSPACE}/"
          version="${{needs.set-version-number.outputs.version}}${{ env.package_suffix }}"
          ${CI_SCRIPT_DIR}/bash/make-source \
            --dists "focal" \
            --arches "amd64" \
            --main-package-name "icu-fw" \
            --supported-distros "focal bionic" \
            --package-version ${version} \
            --preserve-changelog \
            --build-in-place
          mv --verbose ../icu-fw* .
          sg sbuild '${CI_SCRIPT_DIR}/bash/build-package \
            --dists "focal" \
            --arches "amd64" \
            --main-package-name "icu-fw" \
            --supported-distros "focal bionic" \
            --build-in-place \
            --no-upload'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: linux-packages
          path: |
            ./**/results/icu-fw_${{needs.set-version-number.outputs.version}}*.dsc
            ./**/results/icu-fw_${{needs.set-version-number.outputs.version}}*.source.build
            ./**/results/icu-fw_${{needs.set-version-number.outputs.version}}*.source.changes
            ./**/results/icu-fw_${{needs.set-version-number.outputs.version}}*.tar.xz
            ./**/results/*${{needs.set-version-number.outputs.version}}*.deb
          if-no-files-found: error
